name: Foundation CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require committed dependency lockfile
        run: git ls-files --error-unmatch package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
