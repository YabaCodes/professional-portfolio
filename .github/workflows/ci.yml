name: Foundation CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require committed dependency lockfile
        run: git ls-files --error-unmatch package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:design
      - run: npm run build
      - run: npm run test:build
      - run: npm run test:mvp
      - run: npm run test:production-prep
      - run: npx playwright install --with-deps chromium
      - run: npm run test:links
      - run: npm run test:responsive
      - run: npm run test:performance
      - name: Verify dependency manifests unchanged
        run: git diff --exit-code -- package.json package-lock.json
      - name: Upload design specimen screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: design-specimen-screenshots
          path: |
            test-results/design-*.png
            test-results/profile-*.png
            test-results/case-study-*.png
            test-results/expertise-*.png
            test-results/research-*.png
            test-results/contact-*.png
            test-results/engineering-lab-*.png
            test-results/insights-*.png
            test-results/mvp-audit.json
            test-results/production-prep-audit.json
            test-results/performance-diagnostics.json
            test-results/release-review-*.png
          if-no-files-found: error
          retention-days: 14
