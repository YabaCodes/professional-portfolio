name: Foundation CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Restore validated bootstrap lockfile
        if: ${{ hashFiles('package-lock.json') == '' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/pp-004a-project-foundation' }}
        uses: actions/download-artifact@v4
        with:
          name: dependency-lockfile
          run-id: 44996470290
          github-token: ${{ github.token }}
      - name: Verify bootstrap artifact and expose public lockfile for branch commit
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/pp-004a-project-foundation' }}
        run: |
          echo '6643f85254c18c39d01bb63edaab12a993c7011a931a590dc95dcfb3350288cf  package-lock.json' | sha256sum -c -
          base64 -w 1000 package-lock.json | sed 's/^/LOCKFILE_DATA:/'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Lockfile must be committed before acceptance
        run: git ls-files --error-unmatch package-lock.json
